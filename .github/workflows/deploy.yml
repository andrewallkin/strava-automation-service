name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          # Values for generating .env on the VPS
          ENV_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          ENV_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ENV_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ENV_POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          ENV_POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          ENV_BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          ENV_FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          ENV_APP_ENV: ${{ secrets.APP_ENV }}
          ENV_APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          ENV_PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ENV_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          ENV_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          ENV_STRAVA_WEBHOOK_VERIFY_TOKEN: ${{ secrets.STRAVA_WEBHOOK_VERIFY_TOKEN }}
          ENV_STRAVA_ALLOWED_ATHLETE_ID: ${{ secrets.STRAVA_ALLOWED_ATHLETE_ID }}
          ENV_STRAVA_SCOPES: ${{ secrets.STRAVA_SCOPES }}
          ENV_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENV_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ENV_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          ENV_TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          ENV_COACH_TELEGRAM_BOT_TOKEN: ${{ secrets.COACH_TELEGRAM_BOT_TOKEN }}
          ENV_COACH_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.COACH_TELEGRAM_WEBHOOK_SECRET }}
          ENV_COACH_TELEGRAM_ALLOWED_USER_ID: ${{ secrets.COACH_TELEGRAM_ALLOWED_USER_ID }}
          ENV_COACH_TELEGRAM_WEBHOOK_URL: ${{ secrets.COACH_TELEGRAM_WEBHOOK_URL }}
          ENV_COACH_CONVERSATION_HISTORY_USER_TURN_LIMIT: ${{ secrets.COACH_CONVERSATION_HISTORY_USER_TURN_LIMIT }}
          ENV_COACH_LINK_CODE_TTL_SECONDS: ${{ secrets.COACH_LINK_CODE_TTL_SECONDS }}
          ENV_MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          ENV_STRAVA_MCP_BEARER: ${{ secrets.STRAVA_MCP_BEARER }}
        run: |
          ssh -t -i ~/.ssh/id_rsa -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=50 -o ServerAliveCountMax=10 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<EOF
          set -euo pipefail

          # Derive repo name from owner/repo (github.repository)
          REPO_NAME="\$(basename "${GITHUB_REPOSITORY}")"
          BRANCH="${DEPLOY_BRANCH}"

          echo "::group::📦 Deployment Setup"
          echo "Deploying branch: \${BRANCH}"
          echo "Repository: \${REPO_NAME}"
          echo "Changing directory to /srv/apps"
          cd /srv/apps || { echo "Failed to change directory to /srv/apps"; exit 1; }
          echo "::endgroup::"

          echo "::group::🔄 Syncing Code"
          if [ ! -d "\${REPO_NAME}/.git" ]; then
            echo "Cloning fresh repository..."
            rm -rf "\${REPO_NAME}" || true
            mkdir -p "\${REPO_NAME}" || { echo "Failed to create project directory"; exit 1; }
            cd "\${REPO_NAME}" || { echo "Failed to change directory to project directory"; exit 1; }
            git clone -b \${BRANCH} https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git . || { echo "Failed to clone repository"; exit 1; }
          else
            echo "Updating existing repository..."
            cd "\${REPO_NAME}" || { echo "Failed to change directory to project directory"; exit 1; }
            git fetch origin || { echo "Failed to fetch from origin"; exit 1; }
            git checkout \${BRANCH} || git checkout -b \${BRANCH} origin/\${BRANCH} || { echo "Failed to checkout branch"; exit 1; }
            git reset --hard origin/\${BRANCH} || { echo "Failed to reset to origin/\${BRANCH}"; exit 1; }
          fi
          echo "✓ Code synced successfully"
          echo "::endgroup::"

          echo "::group::🔐 Setting up Environment"
          echo "Creating .env file from CI/CD secrets..."
          cat > .env << 'EOF_ENV'
          POSTGRES_USER=${ENV_POSTGRES_USER}
          POSTGRES_PASSWORD=${ENV_POSTGRES_PASSWORD}
          POSTGRES_DB=${ENV_POSTGRES_DB}
          POSTGRES_HOST=${ENV_POSTGRES_HOST}
          POSTGRES_PORT=${ENV_POSTGRES_PORT}

          BACKEND_PORT=${ENV_BACKEND_PORT}
          FRONTEND_PORT=${ENV_FRONTEND_PORT}

          APP_ENV=${ENV_APP_ENV}
          APP_SECRET_KEY=${ENV_APP_SECRET_KEY}
          PUBLIC_BASE_URL=${ENV_PUBLIC_BASE_URL}

          STRAVA_CLIENT_ID=${ENV_STRAVA_CLIENT_ID}
          STRAVA_CLIENT_SECRET=${ENV_STRAVA_CLIENT_SECRET}
          STRAVA_WEBHOOK_VERIFY_TOKEN=${ENV_STRAVA_WEBHOOK_VERIFY_TOKEN}
          STRAVA_ALLOWED_ATHLETE_ID=${ENV_STRAVA_ALLOWED_ATHLETE_ID}
          STRAVA_SCOPES=${ENV_STRAVA_SCOPES}

          TELEGRAM_BOT_TOKEN=${ENV_TELEGRAM_BOT_TOKEN}
          TELEGRAM_WEBHOOK_SECRET=${ENV_TELEGRAM_WEBHOOK_SECRET}
          TELEGRAM_ALLOWED_USER_ID=${ENV_TELEGRAM_ALLOWED_USER_ID}
          TELEGRAM_WEBHOOK_URL=${ENV_TELEGRAM_WEBHOOK_URL}
          COACH_TELEGRAM_BOT_TOKEN=${ENV_COACH_TELEGRAM_BOT_TOKEN}
          COACH_TELEGRAM_WEBHOOK_SECRET=${ENV_COACH_TELEGRAM_WEBHOOK_SECRET}
          COACH_TELEGRAM_ALLOWED_USER_ID=${ENV_COACH_TELEGRAM_ALLOWED_USER_ID}
          COACH_TELEGRAM_WEBHOOK_URL=${ENV_COACH_TELEGRAM_WEBHOOK_URL}
          COACH_CONVERSATION_HISTORY_USER_TURN_LIMIT=${ENV_COACH_CONVERSATION_HISTORY_USER_TURN_LIMIT}
          COACH_LINK_CODE_TTL_SECONDS=${ENV_COACH_LINK_CODE_TTL_SECONDS}
          REDIS_URL=redis://redis:6379/0
          MCP_SERVER_URL=${ENV_MCP_SERVER_URL}
          STRAVA_MCP_BEARER=${ENV_STRAVA_MCP_BEARER}
          EOF_ENV
          echo "✓ Environment configured"
          echo "::endgroup::"

          echo "::group::🧹 Cleaning up old containers"
          docker compose down --remove-orphans 2>&1 || true
          docker image prune -a -f 2>&1 || true
          docker builder prune -a -f 2>&1 || true
          echo "✓ Cleanup complete"
          echo "::endgroup::"

          echo "::group::🔨 Building Docker Images"
          docker compose build || { echo "::error::Docker build failed"; exit 1; }
          echo "✓ Build complete"
          echo "::endgroup::"

          echo "::group::🚀 Starting Containers"
          docker compose up -d --force-recreate || { echo "::error::Failed to start containers"; exit 1; }
          echo "Waiting for containers to stabilize..."
          sleep 5
          echo "✓ Containers started"
          echo "::endgroup::"

          echo "::group::🗄️  Running Database Migrations"
          docker compose exec -T api bash -c "cd /app && ./run_migrations.sh" || { echo "::error::Database migration failed"; exit 1; }
          echo "::endgroup::"

          echo "::group::✅ Deployment Status"
          docker compose ps
          echo "::endgroup::"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Deployment Complete!"
          echo "✓ All migrations applied successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EOF

      - name: Register Webhooks
        env:
          ENV_PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          ENV_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          ENV_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          ENV_STRAVA_WEBHOOK_VERIFY_TOKEN: ${{ secrets.STRAVA_WEBHOOK_VERIFY_TOKEN }}
          ENV_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENV_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ENV_COACH_TELEGRAM_BOT_TOKEN: ${{ secrets.COACH_TELEGRAM_BOT_TOKEN }}
          ENV_COACH_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.COACH_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          echo "::group::🔗 Registering Strava Webhook"
          STRAVA_CALLBACK_URL="${ENV_PUBLIC_BASE_URL}/api/strava/webhook"
          echo "Callback URL: ${STRAVA_CALLBACK_URL}"
          EXISTING_JSON=$(curl -sf "https://www.strava.com/api/v3/push_subscriptions?client_id=${ENV_STRAVA_CLIENT_ID}&client_secret=${ENV_STRAVA_CLIENT_SECRET}" || echo "[]")
          EXISTING_ID=$(echo "${EXISTING_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if isinstance(d,list) and d else '')" 2>/dev/null || echo "")
          EXISTING_CB=$(echo "${EXISTING_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['callback_url'] if isinstance(d,list) and d else '')" 2>/dev/null || echo "")
          if [ -n "${EXISTING_ID}" ] && [ "${EXISTING_CB}" = "${STRAVA_CALLBACK_URL}" ]; then
            echo "✓ Webhook already registered (id=${EXISTING_ID})"
          else
            if [ -n "${EXISTING_ID}" ]; then
              echo "Removing stale subscription (id=${EXISTING_ID}, url=${EXISTING_CB})..."
              curl -sf -X DELETE "https://www.strava.com/api/v3/push_subscriptions/${EXISTING_ID}?client_id=${ENV_STRAVA_CLIENT_ID}&client_secret=${ENV_STRAVA_CLIENT_SECRET}" || true
            fi
            echo "Creating webhook subscription..."
            RESULT=$(curl -sf -X POST https://www.strava.com/api/v3/push_subscriptions \
              -F "client_id=${ENV_STRAVA_CLIENT_ID}" \
              -F "client_secret=${ENV_STRAVA_CLIENT_SECRET}" \
              -F "callback_url=${STRAVA_CALLBACK_URL}" \
              -F "verify_token=${ENV_STRAVA_WEBHOOK_VERIFY_TOKEN}" || echo "curl_failed")
            if echo "${RESULT}" | grep -q '"id"'; then
              echo "✓ Webhook registered: ${RESULT}"
            else
              echo "⚠️  Webhook registration may have failed: ${RESULT}"
            fi
          fi
          echo "::endgroup::"

          echo "::group::🤖 Registering Telegram Webhook"
          echo "Setting Telegram webhook..."
          TRESULT=$(curl -sf -X POST "https://api.telegram.org/bot${ENV_TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"${ENV_PUBLIC_BASE_URL}/api/telegram/webhook/${ENV_TELEGRAM_WEBHOOK_SECRET}\"}" || echo "curl_failed")
          if echo "${TRESULT}" | grep -q '"ok":true'; then
            echo "✓ Telegram webhook registered"
          else
            echo "⚠️  Telegram webhook registration may have failed: ${TRESULT}"
          fi
          echo "::endgroup::"

          echo "::group::🧠 Registering Coach Telegram Webhook"
          echo "Setting coach Telegram webhook..."
          CRESULT=$(curl -sf -X POST "https://api.telegram.org/bot${ENV_COACH_TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"${ENV_PUBLIC_BASE_URL}/api/telegram/coach/webhook/${ENV_COACH_TELEGRAM_WEBHOOK_SECRET}\"}" || echo "curl_failed")
          if echo "${CRESULT}" | grep -q '"ok":true'; then
            echo "✓ Coach Telegram webhook registered"
          else
            echo "⚠️  Coach Telegram webhook registration may have failed: ${CRESULT}"
          fi
          echo "::endgroup::"
