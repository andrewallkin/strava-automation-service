name: Build and push images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Backend tests
        working-directory: backend
        env:
          POSTGRES_DB: strava_automation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          APP_SECRET_KEY: test-secret-test-secret-test-secret
        run: |
          uv sync --frozen --extra dev
          uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive image metadata
        id: image_meta
        run: |
          set -euo pipefail

          BRANCH_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_REPO="andrewallkin/strava-automation-service"

          API_IMAGE="${IMAGE_REPO}:api-${BRANCH_SLUG}-${SHORT_SHA}"
          FRONTEND_IMAGE="${IMAGE_REPO}:frontend-${BRANCH_SLUG}-${SHORT_SHA}"
          MCP_IMAGE="${IMAGE_REPO}:mcp-${BRANCH_SLUG}-${SHORT_SHA}"
          API_BRANCH_LATEST="${IMAGE_REPO}:api-${BRANCH_SLUG}-latest"
          FRONTEND_BRANCH_LATEST="${IMAGE_REPO}:frontend-${BRANCH_SLUG}-latest"
          MCP_BRANCH_LATEST="${IMAGE_REPO}:mcp-${BRANCH_SLUG}-latest"

          echo "api_image=${API_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "mcp_image=${MCP_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "api_branch_latest=${API_BRANCH_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "frontend_branch_latest=${FRONTEND_BRANCH_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "mcp_branch_latest=${MCP_BRANCH_LATEST}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api/mcp image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image_meta.outputs.api_image }}
            ${{ steps.image_meta.outputs.api_branch_latest }}
            ${{ steps.image_meta.outputs.mcp_image }}
            ${{ steps.image_meta.outputs.mcp_branch_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image_meta.outputs.frontend_image }}
            ${{ steps.image_meta.outputs.frontend_branch_latest }}
