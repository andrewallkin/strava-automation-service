services:
  api:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    depends_on: []
    env_file:
      - .env
    restart: always
    networks: [default, postgres-net]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - api
    restart: always
    networks: [default]

  mcp:
    build:
      context: ./backend
    command: ["python", "-m", "app.mcp.server"]
    ports:
      - "${MCP_PORT:-8003}:8000"
    depends_on:
      - api
    env_file:
      - .env
    restart: always
    networks: [default, postgres-net]

networks:
  default:
  postgres-net:
    external: true
