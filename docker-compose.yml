services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: always
    networks: [default]

  api:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    depends_on:
      - redis
    env_file:
      - .env
    restart: always
    networks: [default, postgres-net]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - api
    restart: always
    networks: [default]

  mcp:
    build:
      context: ./backend
    command: ["python", "-m", "app.mcp.server"]
    ports:
      - "${MCP_PORT:-8004}:8000"
    depends_on:
      - api
      - redis
    env_file:
      - .env
    restart: always
    networks: [default, postgres-net]

networks:
  default:
  postgres-net:
    external: true
