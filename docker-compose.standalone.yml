# Self-contained stack for running without the VPS control panel.

services:
  postgres:
    image: postgres:15
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-strava_automation}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [postgres-net]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      STRAVA_ALLOWED_ATHLETE_ID: ${STRAVA_ALLOWED_ATHLETE_ID:-9900001}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-9100001}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [default, postgres-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [default]

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.mcp.server"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      STRAVA_ALLOWED_ATHLETE_ID: ${STRAVA_ALLOWED_ATHLETE_ID:-9900001}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-9100001}
    ports:
      - "127.0.0.1:${MCP_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [default, postgres-net]

volumes:
  postgres_data:

networks:
  postgres-net:
    driver: bridge